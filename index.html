<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">


    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-xl border border-slate-100">
        <h1 class="text-3xl font-extrabold mb-8 text-center text-sky-700">اختبار المعلومات السريع</h1>

        <!-- نموذج الأسئلة -->
        <form id="quizForm" class="space-y-8" onsubmit="calculateScore(event)">

            <!-- السؤال الأول -->
            <div class="bg-gradient-to-br from-sky-50 to-white p-5 rounded-2xl border border-sky-100 shadow-inner">
                <label class="block font-semibold mb-4 text-sky-950 text-lg">1. مين أفضل مهندس حاسوب في الوطن
                    العربي؟</label>
                <div class="space-y-3">
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q1" value="wrong1" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900">أحمد علي</span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q1" value="correct" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900 font-medium">محمد ناجي ابو القمبز</span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q1" value="wrong2" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900">محمود حسن</span>
                    </label>
                </div>
            </div>

            <!-- السؤال الثاني -->
            <div class="bg-gradient-to-br from-sky-50 to-white p-5 rounded-2xl border border-sky-100 shadow-inner">
                <label class="block font-semibold mb-4 text-sky-950 text-lg">2. مين أفضل مركز في قطاع غزة؟</label>
                <div class="space-y-3">
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q2" value="wrong1" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900">مركز البرمجيات المتقدمة</span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q2" value="correct" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900 font-medium">pcit</span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q2" value="wrong2" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900">مركز غزة التقني</span>
                    </label>
                </div>
            </div>

            <!-- السؤال الثالث -->
            <div class="bg-gradient-to-br from-sky-50 to-white p-5 rounded-2xl border border-sky-100 shadow-inner">
                <label class="block font-semibold mb-4 text-sky-950 text-lg">3. مين أفضل إدارة في الكوكب؟</label>
                <div class="space-y-3">
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q3" value="wrong1" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900"> محمد الكحلوت</span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q3" value="wrong2" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900"> عبدالله مطر </span>
                    </label>
                    <label
                        class="flex items-center gap-3 cursor-pointer p-3 rounded-lg hover:bg-sky-100 transition group">
                        <input type="radio" name="q3" value="correct" class="size-5 accent-sky-600 focus:ring-sky-500">
                        <span class="text-slate-700 group-hover:text-sky-900 font-medium">يافا الكفارنة</span>
                    </label>
                </div>
            </div>

            <!-- زر تقديم الإجابات -->
            <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-sky-200 text-lg cursor-pointer">
                إظهار النتيجة
            </button>
        </form>

        <!-- منطقة عرض النتيجة -->
        <div id="resultBox" class="mt-10 hidden bg-sky-700 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <h2 class="text-2xl font-bold text-sky-100">نتيجة الاختبار</h2>
            <p id="scoreText" class="text-5xl font-extrabold text-white">0 / 3</p>
            <p id="feedbackText" class="text-base text-sky-200 font-medium"></p>
            <button onclick="resetQuiz()"
                class="mt-4 bg-white text-sky-800 font-semibold px-6 py-2 rounded-full transition hover:bg-sky-50 cursor-pointer">
                إعادة الاختبار
            </button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
